# Образец настроек. Скопируйте в seo.toml или создайте файл командой seo init.

[project]
url = "https://example.ru/"
type = "shop"  # shop, services, content или other

# Регионы Яндекса. Первый считается основным. Если блок не указан, используется вся Россия.
[[regions]]
id = "225"
name = "Россия"

[[regions]]
id = "213"
name = "Москва"

[competitors]
domains = ["competitor.ru"]

[demand]
# Основы слов ниши: идеи Вордстата без них считаются шумом. Пустой список — без фильтра.
markers = ["мебел"]
# Фразы с этими основами не попадут в идеи.
excluded = ["бесплатно"]
# Уточнение для запросов разделов: без него «купить кольца» включает и бетонные кольца.
qualifier = "мебель"

# Какие разделы превращать в поисковые запросы. {name} — H1 страницы, звёздочка — один сегмент URL.
# Если блоков нет, правила выбираются по типу проекта.
[[seeds]]
path = "/catalog/*/"
template = "купить {name}"
source = "catalog"

# Вебмастер отдаёт данные по областям, поэтому код свой. Блок необязательный.
[webmaster]
region_id = "1"
region_name = "Москва и область"

[limits]
serp_monthly = 3000

# Цены Yandex Cloud, рублей за 1000 запросов. Проверяйте перед большими запусками.
[prices]
serp_per_1000_rub = 30.5
serp_sync_per_1000_rub = 488.0
wordstat_per_1000_rub = 20.0
