[project]
name = "seo-mini"
version = "0.1.0"
description = "Бесплатный SEO-сервис для сайтов на русском языке: факты считает код, выводы делает ваш агент"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
keywords = ["seo", "yandex", "wordstat", "audit", "agents"]
dependencies = ["httpx>=0.27", "beautifulsoup4>=4.12"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
seo = "seo_service.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["seo_service"]

[tool.setuptools.package-data]
seo_service = ["dashboard_template.html", "skills/*/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
